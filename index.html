<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MrFixik - Заявка на ремонт</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%); min-height: 100vh; color: white; overflow-x: hidden; }
        
        @keyframes float { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-20px) rotate(5deg); } }
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.5); } 50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.8), 0 0 60px rgba(139, 92, 246, 0.4); } }
        @keyframes fade-in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slide-up { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce-in { 0% { transform: scale(0); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes confetti { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-100px) rotate(720deg); opacity: 0; } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
        .animate-fade-in { animation: fade-in 0.6s ease-out forwards; }
        .animate-slide-up { animation: slide-up 0.8s ease-out forwards; }
        .animate-bounce-in { animation: bounce-in 0.5s ease-out forwards; }
        .animate-shimmer { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); background-size: 200% 100%; animation: shimmer 2s infinite; }
        .animate-spin-slow { animation: spin-slow 20s linear infinite; }
        
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-card { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; transition: all 0.3s ease; }
        .glass-card:hover { transform: translateY(-2px); border-color: rgba(139, 92, 246, 0.5); }
        
        .btn-primary { background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%); border: none; border-radius: 16px; padding: 16px 32px; color: white; font-weight: 600; font-size: 18px; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(139, 92, 246, 0.4); }
        .btn-primary:active { transform: translateY(0); }
        
        .input-field { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 14px 16px; color: white; font-size: 16px; width: 100%; transition: all 0.3s ease; }
        .input-field:focus { outline: none; border-color: #8b5cf6; background: rgba(255, 255, 255, 0.12); box-shadow: 0 0 20px rgba(139, 92, 246, 0.2); }
        .input-field::placeholder { color: rgba(255, 255, 255, 0.4); }
        
        .device-btn { background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 16px 12px; color: white; cursor: pointer; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .device-btn:hover { border-color: rgba(139, 92, 246, 0.5); background: rgba(139, 92, 246, 0.1); transform: translateY(-2px); }
        .device-btn.selected { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.2); box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); }
        
        .urgency-btn { background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 14px 20px; color: white; cursor: pointer; transition: all 0.3s ease; flex: 1; text-align: center; }
        .urgency-btn:hover { transform: translateY(-2px); }
        .urgency-btn.selected { transform: scale(1.02); }
        .urgency-btn.green.selected { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }
        .urgency-btn.yellow.selected { border-color: #eab308; background: rgba(234, 179, 8, 0.2); }
        .urgency-btn.red.selected { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }
        
        .progress-bar { height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #8b5cf6, #6366f1); border-radius: 2px; transition: width 0.5s ease; }
        
        .quick-tag { background: rgba(139, 92, 246, 0.2); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 20px; padding: 8px 14px; font-size: 13px; color: #c4b5fd; cursor: pointer; transition: all 0.3s ease; white-space: nowrap; }
        .quick-tag:hover { background: rgba(139, 92, 246, 0.3); border-color: #8b5cf6; }
        
        .brand-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; padding: 10px 14px; color: white; cursor: pointer; transition: all 0.3s ease; font-size: 14px; }
        .brand-btn:hover { border-color: rgba(139, 92, 246, 0.5); background: rgba(139, 92, 246, 0.1); }
        .brand-btn.selected { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.25); }
        
        .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: rgba(30, 27, 75, 0.98); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; margin-top: 4px; max-height: 200px; overflow-y: auto; z-index: 50; }
        .suggestion-item { padding: 12px 16px; cursor: pointer; transition: all 0.2s ease; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .suggestion-item:hover { background: rgba(139, 92, 246, 0.2); }
        .suggestion-item:last-child { border-bottom: none; }
        
        .confetti-piece { position: fixed; width: 10px; height: 10px; border-radius: 2px; animation: confetti 1s ease-out forwards; pointer-events: none; z-index: 100; }
        
        .particle { position: fixed; width: 4px; height: 4px; background: rgba(139, 92, 246, 0.5); border-radius: 50%; pointer-events: none; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.5); border-radius: 3px; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // Данные брендов и моделей
        const deviceBrands = {
            'Смартфон': ['Apple iPhone', 'Samsung', 'Xiaomi', 'Huawei', 'Honor', 'OPPO', 'Vivo', 'Realme', 'OnePlus', 'Google Pixel', 'Sony', 'Motorola', 'Nokia', 'ASUS', 'Poco', 'Redmi', 'Nothing', 'Meizu'],
            'Ноутбук': ['Apple MacBook', 'ASUS', 'Lenovo', 'HP', 'Dell', 'Acer', 'MSI', 'Huawei', 'Honor', 'Samsung', 'Xiaomi', 'Razer', 'Microsoft Surface', 'LG', 'Gigabyte', 'Alienware'],
            'Компьютер': ['Собранный ПК', 'Apple iMac', 'Apple Mac Mini', 'Apple Mac Pro', 'HP', 'Dell', 'Lenovo', 'ASUS', 'Acer', 'MSI'],
            'Телевизор': ['Samsung', 'LG', 'Sony', 'Philips', 'TCL', 'Hisense', 'Xiaomi', 'Haier', 'Panasonic', 'Sharp', 'Toshiba', 'DEXP', 'Hyundai'],
            'Аудиотехника': ['Sony', 'JBL', 'Bose', 'Marshall', 'Harman Kardon', 'Bang & Olufsen', 'Beats', 'Sennheiser', 'Audio-Technica', 'Denon', 'Yamaha', 'Pioneer', 'Sonos'],
            'Бытовая техника': ['Samsung', 'LG', 'Bosch', 'Siemens', 'Electrolux', 'Whirlpool', 'Haier', 'Xiaomi', 'Dyson', 'Philips', 'Tefal', 'Braun', 'Karcher', 'iRobot', 'Polaris'],
            'Другое': []
        };
        
        const brandModels = {
            'Apple iPhone': ['iPhone 15 Pro Max', 'iPhone 15 Pro', 'iPhone 15 Plus', 'iPhone 15', 'iPhone 14 Pro Max', 'iPhone 14 Pro', 'iPhone 14 Plus', 'iPhone 14', 'iPhone 13 Pro Max', 'iPhone 13 Pro', 'iPhone 13', 'iPhone 13 mini', 'iPhone 12 Pro Max', 'iPhone 12 Pro', 'iPhone 12', 'iPhone 12 mini', 'iPhone 11 Pro Max', 'iPhone 11 Pro', 'iPhone 11', 'iPhone XS Max', 'iPhone XS', 'iPhone XR', 'iPhone X', 'iPhone 8 Plus', 'iPhone 8', 'iPhone SE 2024', 'iPhone SE 2022', 'iPhone SE 2020'],
            'Samsung': ['Galaxy S24 Ultra', 'Galaxy S24+', 'Galaxy S24', 'Galaxy S23 Ultra', 'Galaxy S23+', 'Galaxy S23', 'Galaxy S22 Ultra', 'Galaxy S22+', 'Galaxy S22', 'Galaxy Z Fold 5', 'Galaxy Z Flip 5', 'Galaxy Z Fold 4', 'Galaxy Z Flip 4', 'Galaxy A54', 'Galaxy A34', 'Galaxy A14', 'Galaxy Note 20 Ultra', 'Galaxy Note 20'],
            'Xiaomi': ['Xiaomi 14 Ultra', 'Xiaomi 14 Pro', 'Xiaomi 14', 'Xiaomi 13 Ultra', 'Xiaomi 13 Pro', 'Xiaomi 13', 'Xiaomi 12 Pro', 'Xiaomi 12', 'Mi 11 Ultra', 'Mi 11 Pro', 'Mi 11'],
            'Apple MacBook': ['MacBook Pro 16 M3 Max', 'MacBook Pro 16 M3 Pro', 'MacBook Pro 14 M3 Max', 'MacBook Pro 14 M3 Pro', 'MacBook Pro 14 M3', 'MacBook Air 15 M3', 'MacBook Air 13 M3', 'MacBook Air 15 M2', 'MacBook Air 13 M2', 'MacBook Pro 13 M2', 'MacBook Air M1', 'MacBook Pro 13 M1']
        };
        
        const quickProblems = ['Не включается', 'Не заряжается', 'Разбит экран', 'Не работает звук', 'Проблемы с батареей', 'Залитие жидкостью', 'Зависает', 'Греется'];
        
        const deviceTypes = [
            { id: 'phone', name: 'Смартфон', icon: '📱' },
            { id: 'laptop', name: 'Ноутбук', icon: '💻' },
            { id: 'pc', name: 'Компьютер', icon: '🖥️' },
            { id: 'tv', name: 'Телевизор', icon: '📺' },
            { id: 'audio', name: 'Аудиотехника', icon: '🎧' },
            { id: 'appliance', name: 'Бытовая техника', icon: '🔌' },
            { id: 'other', name: 'Другое', icon: '🔧' }
        ];
        
        const urgencyOptions = [
            { id: 'low', name: 'Не срочно', icon: '🟢', color: 'green', desc: 'Когда будет удобно' },
            { id: 'medium', name: '1-3 дня', icon: '🟡', color: 'yellow', desc: 'В ближайшие дни' },
            { id: 'high', name: 'Очень срочно', icon: '🔴', color: 'red', desc: 'Нужно сегодня' }
        ];
        
        // Компонент частиц на фоне
        function Particles() {
            return (
                <div style={{position: 'fixed', inset: 0, overflow: 'hidden', pointerEvents: 'none', zIndex: 0}}>
                    {[...Array(20)].map((_, i) => (
                        <div key={i} className="particle animate-float" style={{
                            left: `${Math.random() * 100}%`,
                            top: `${Math.random() * 100}%`,
                            animationDelay: `${Math.random() * 5}s`,
                            animationDuration: `${5 + Math.random() * 10}s`,
                            opacity: 0.3 + Math.random() * 0.4,
                            width: `${2 + Math.random() * 4}px`,
                            height: `${2 + Math.random() * 4}px`
                        }}></div>
                    ))}
                </div>
            );
        }
        
        // Компонент конфетти
        function Confetti() {
            const colors = ['#8b5cf6', '#6366f1', '#22c55e', '#eab308', '#ec4899', '#06b6d4'];
            return (
                <div style={{position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 100}}>
                    {[...Array(50)].map((_, i) => (
                        <div key={i} className="confetti-piece" style={{
                            left: `${Math.random() * 100}%`,
                            top: '50%',
                            background: colors[Math.floor(Math.random() * colors.length)],
                            animationDelay: `${Math.random() * 0.5}s`
                        }}></div>
                    ))}
                </div>
            );
        }
        
        // Экран приветствия
        function WelcomeScreen({ onStart }) {
            return (
                <div style={{minHeight: '100vh', display: 'flex', flexDirection: 'column', padding: '24px 20px', position: 'relative', zIndex: 1}}>
                    <Particles />
                    
                    {/* Логотип */}
                    <div className="animate-fade-in" style={{textAlign: 'center', marginTop: '40px'}}>
                        <div className="animate-float" style={{
                            width: '100px', height: '100px', margin: '0 auto 24px',
                            background: 'linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%)',
                            borderRadius: '28px', display: 'flex', alignItems: 'center', justifyContent: 'center',
                            fontSize: '48px', boxShadow: '0 20px 60px rgba(139, 92, 246, 0.4)'
                        }}>🔧</div>
                        
                        <h1 style={{
                            fontSize: '42px', fontWeight: 800, marginBottom: '8px',
                            background: 'linear-gradient(135deg, #fff 0%, #c4b5fd 100%)',
                            WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent'
                        }}>MrFixik</h1>
                        
                        <p style={{color: 'rgba(255,255,255,0.5)', fontSize: '14px', letterSpacing: '2px', textTransform: 'uppercase'}}>
                            Сервис ремонта техники
                        </p>
                    </div>
                    
                    {/* Приветствие */}
                    <div className="animate-slide-up" style={{textAlign: 'center', marginTop: '40px', animationDelay: '0.2s'}}>
                        <p style={{fontSize: '28px', marginBottom: '8px'}}>👋</p>
                        <h2 style={{fontSize: '26px', fontWeight: 700, marginBottom: '12px'}}>Добро пожаловать!</h2>
                        <p style={{color: 'rgba(255,255,255,0.7)', fontSize: '16px', lineHeight: 1.6}}>
                            Создайте заявку на ремонт, и я свяжусь с вами <strong style={{color: '#8b5cf6'}}>в течение 15 минут</strong>
                        </p>
                    </div>
                    
                    {/* Кнопка */}
                    <div className="animate-slide-up" style={{marginTop: '32px', animationDelay: '0.4s'}}>
                        <button onClick={onStart} className="btn-primary animate-pulse-glow" style={{width: '100%', fontSize: '18px', padding: '18px 32px'}}>
                            <span style={{marginRight: '8px'}}>📝</span>
                            Создать заявку на ремонт
                        </button>
                    </div>
                    
                    {/* Преимущества */}
                    <div style={{display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '12px', marginTop: '40px'}}>
                        {[
                            { icon: '🚀', title: 'Быстро', desc: 'Свяжусь за 15 минут' },
                            { icon: '🛡️', title: 'Опыт с 2007', desc: '18 лет в ремонте' },
                            { icon: '💎', title: 'Гарантия', desc: 'от 14 до 90 дней' }
                        ].map((item, i) => (
                            <div key={i} className="glass-card animate-slide-up" style={{padding: '20px 12px', textAlign: 'center', animationDelay: `${0.5 + i * 0.1}s`}}>
                                <div style={{fontSize: '32px', marginBottom: '12px'}}>{item.icon}</div>
                                <div style={{fontWeight: 600, marginBottom: '4px', fontSize: '14px'}}>{item.title}</div>
                                <div style={{fontSize: '11px', color: 'rgba(255,255,255,0.5)'}}>{item.desc}</div>
                            </div>
                        ))}
                    </div>
                    
                    {/* Статистика */}
                    <div className="glass-card animate-slide-up" style={{display: 'flex', justifyContent: 'space-around', padding: '20px', marginTop: '24px', animationDelay: '0.8s'}}>
                        {[
                            { value: '5000+', label: 'Ремонтов' },
                            { value: '18 лет', label: 'Опыта' },
                            { value: '24/7', label: 'На связи' }
                        ].map((stat, i) => (
                            <div key={i} style={{textAlign: 'center'}}>
                                <div style={{fontSize: '24px', fontWeight: 700, background: 'linear-gradient(135deg, #8b5cf6, #6366f1)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent'}}>{stat.value}</div>
                                <div style={{fontSize: '12px', color: 'rgba(255,255,255,0.5)', marginTop: '4px'}}>{stat.label}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }
        
        // Форма заявки
        function RepairForm({ onSubmit, onBack }) {
            const [step, setStep] = useState(1);
            const [formData, setFormData] = useState({
                deviceType: '', deviceName: '', brand: '', model: '', problem: '', urgency: '', address: '', phone: ''
            });
            const [showBrandSuggestions, setShowBrandSuggestions] = useState(false);
            const [showModelSuggestions, setShowModelSuggestions] = useState(false);
            const [filteredBrands, setFilteredBrands] = useState([]);
            const [filteredModels, setFilteredModels] = useState([]);
            
            const totalSteps = 5;
            const progress = (step / totalSteps) * 100;
            
            const handleDeviceSelect = (device) => {
                setFormData({...formData, deviceType: device.id, deviceName: device.name, brand: '', model: ''});
                setTimeout(() => setStep(2), 300);
            };
            
            const handleBrandInput = (value) => {
                setFormData({...formData, brand: value, model: ''});
                const brands = deviceBrands[formData.deviceName] || [];
                const filtered = brands.filter(b => b.toLowerCase().includes(value.toLowerCase()));
                setFilteredBrands(filtered);
                setShowBrandSuggestions(value.length > 0 && filtered.length > 0);
            };
            
            const handleBrandSelect = (brand) => {
                setFormData({...formData, brand: brand, model: ''});
                setShowBrandSuggestions(false);
            };
            
            const handleModelInput = (value) => {
                setFormData({...formData, model: value});
                const models = brandModels[formData.brand] || [];
                const filtered = models.filter(m => m.toLowerCase().includes(value.toLowerCase()));
                setFilteredModels(filtered);
                setShowModelSuggestions(value.length > 0 && filtered.length > 0);
            };
            
            const handleModelSelect = (model) => {
                setFormData({...formData, model: model});
                setShowModelSuggestions(false);
            };
            
            const handleQuickProblem = (problem) => {
                const current = formData.problem;
                const newProblem = current ? `${current}, ${problem.toLowerCase()}` : problem;
                setFormData({...formData, problem: newProblem});
            };
            
            const handleUrgencySelect = (urgency) => {
                setFormData({...formData, urgency: urgency.id});
                setTimeout(() => setStep(5), 300);
            };
            
            const canProceed = () => {
                switch(step) {
                    case 1: return !!formData.deviceType;
                    case 2: return !!formData.brand;
                    case 3: return formData.problem.length >= 5;
                    case 4: return !!formData.urgency;
                    case 5: return formData.phone.length >= 10;
                    default: return false;
                }
            };
            
            const handleSubmit = () => {
                if (canProceed()) {
                    onSubmit(formData);
                }
            };
            
            const popularBrands = (deviceBrands[formData.deviceName] || []).slice(0, 8);
            
            return (
                <div style={{minHeight: '100vh', display: 'flex', flexDirection: 'column', padding: '20px', position: 'relative', zIndex: 1}}>
                    <Particles />
                    
                    {/* Заголовок */}
                    <div style={{display: 'flex', alignItems: 'center', marginBottom: '20px'}}>
                        <button onClick={step > 1 ? () => setStep(step - 1) : onBack} style={{
                            background: 'rgba(255,255,255,0.1)', border: 'none', borderRadius: '12px',
                            width: '44px', height: '44px', display: 'flex', alignItems: 'center', justifyContent: 'center',
                            color: 'white', fontSize: '20px', cursor: 'pointer'
                        }}>←</button>
                        <div style={{flex: 1, textAlign: 'center'}}>
                            <h1 style={{fontSize: '20px', fontWeight: 700}}>Новая заявка</h1>
                            <p style={{fontSize: '13px', color: 'rgba(255,255,255,0.5)'}}>Шаг {step} из {totalSteps}</p>
                        </div>
                        <div style={{width: '44px'}}></div>
                    </div>
                    
                    {/* Прогресс */}
                    <div className="progress-bar" style={{marginBottom: '24px'}}>
                        <div className="progress-fill" style={{width: `${progress}%`}}></div>
                    </div>
                    
                    {/* Шаг 1: Тип техники */}
                    {step === 1 && (
                        <div className="animate-fade-in">
                            <div style={{textAlign: 'center', marginBottom: '24px'}}>
                                <span style={{fontSize: '40px'}}>💻</span>
                                <h2 style={{fontSize: '22px', fontWeight: 700, marginTop: '12px'}}>Тип техники</h2>
                                <p style={{color: 'rgba(255,255,255,0.6)', marginTop: '8px'}}>Выберите, что нужно отремонтировать</p>
                            </div>
                            <div style={{display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '12px'}}>
                                {deviceTypes.map((device, i) => (
                                    <button key={device.id} onClick={() => handleDeviceSelect(device)}
                                        className={`device-btn ${formData.deviceType === device.id ? 'selected' : ''}`}
                                        style={{animationDelay: `${i * 0.05}s`}}>
                                        <span style={{fontSize: '32px'}}>{device.icon}</span>
                                        <span style={{fontWeight: 500}}>{device.name}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}
                    
                    {/* Шаг 2: Бренд и модель */}
                    {step === 2 && (
                        <div className="animate-fade-in">
                            <div style={{textAlign: 'center', marginBottom: '24px'}}>
                                <span style={{fontSize: '40px'}}>📱</span>
                                <h2 style={{fontSize: '22px', fontWeight: 700, marginTop: '12px'}}>Модель устройства</h2>
                                <p style={{color: 'rgba(255,255,255,0.6)', marginTop: '8px'}}>Укажите бренд и модель</p>
                            </div>
                            
                            {/* Популярные бренды */}
                            {popularBrands.length > 0 && (
                                <div style={{marginBottom: '20px'}}>
                                    <p style={{fontSize: '13px', color: 'rgba(255,255,255,0.5)', marginBottom: '10px'}}>Популярные бренды:</p>
                                    <div style={{display: 'flex', flexWrap: 'wrap', gap: '8px'}}>
                                        {popularBrands.map(brand => (
                                            <button key={brand} onClick={() => handleBrandSelect(brand)}
                                                className={`brand-btn ${formData.brand === brand ? 'selected' : ''}`}>
                                                {brand}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}
                            
                            {/* Поле бренда */}
                            <div style={{position: 'relative', marginBottom: '16px'}}>
                                <label style={{display: 'block', marginBottom: '8px', fontSize: '14px', color: 'rgba(255,255,255,0.7)'}}>Бренд *</label>
                                <input type="text" className="input-field" placeholder="Например: Apple iPhone"
                                    value={formData.brand} onChange={(e) => handleBrandInput(e.target.value)}
                                    onFocus={() => formData.brand && setShowBrandSuggestions(true)}
                                    onBlur={() => setTimeout(() => setShowBrandSuggestions(false), 200)} />
                                {showBrandSuggestions && (
                                    <div className="suggestions">
                                        {filteredBrands.map(brand => (
                                            <div key={brand} className="suggestion-item" onClick={() => handleBrandSelect(brand)}>{brand}</div>
                                        ))}
                                    </div>
                                )}
                            </div>
                            
                            {/* Поле модели */}
                            <div style={{position: 'relative', marginBottom: '24px'}}>
                                <label style={{display: 'block', marginBottom: '8px', fontSize: '14px', color: 'rgba(255,255,255,0.7)'}}>Модель</label>
                                <input type="text" className="input-field" placeholder="Например: iPhone 14 Pro"
                                    value={formData.model} onChange={(e) => handleModelInput(e.target.value)}
                                    onFocus={() => formData.model && setShowModelSuggestions(true)}
                                    onBlur={() => setTimeout(() => setShowModelSuggestions(false), 200)} />
                                {showModelSuggestions && (
                                    <div className="suggestions">
                                        {filteredModels.map(model => (
                                            <div key={model} className="suggestion-item" onClick={() => handleModelSelect(model)}>{model}</div>
                                        ))}
                                    </div>
                                )}
                            </div>
                            
                            <button onClick={() => setStep(3)} disabled={!formData.brand}
                                className="btn-primary" style={{width: '100%', opacity: formData.brand ? 1 : 0.5}}>
                                Продолжить
                            </button>
                        </div>
                    )}
                    
                    {/* Шаг 3: Описание проблемы */}
                    {step === 3 && (
                        <div className="animate-fade-in">
                            <div style={{textAlign: 'center', marginBottom: '24px'}}>
                                <span style={{fontSize: '40px'}}>⚠️</span>
                                <h2 style={{fontSize: '22px', fontWeight: 700, marginTop: '12px'}}>Описание проблемы</h2>
                                <p style={{color: 'rgba(255,255,255,0.6)', marginTop: '8px'}}>Опишите, что случилось с устройством</p>
                            </div>
                            
                            {/* Быстрые теги */}
                            <div style={{marginBottom: '16px'}}>
                                <p style={{fontSize: '13px', color: 'rgba(255,255,255,0.5)', marginBottom: '10px'}}>Быстрый выбор:</p>
                                <div style={{display: 'flex', flexWrap: 'wrap', gap: '8px'}}>
                                    {quickProblems.map(problem => (
                                        <button key={problem} className="quick-tag" onClick={() => handleQuickProblem(problem)}>{problem}</button>
                                    ))}
                                </div>
                            </div>
                            
                            <textarea className="input-field" rows="4" placeholder="Подробно опишите проблему..."
                                value={formData.problem} onChange={(e) => setFormData({...formData, problem: e.target.value})}
                                style={{resize: 'none', marginBottom: '24px'}} />
                            
                            <button onClick={() => setStep(4)} disabled={formData.problem.length < 5}
                                className="btn-primary" style={{width: '100%', opacity: formData.problem.length >= 5 ? 1 : 0.5}}>
                                Продолжить
                            </button>
                        </div>
                    )}
                    
                    {/* Шаг 4: Срочность */}
                    {step === 4 && (
                        <div className="animate-fade-in">
                            <div style={{textAlign: 'center', marginBottom: '24px'}}>
                                <span style={{fontSize: '40px'}}>⏰</span>
                                <h2 style={{fontSize: '22px', fontWeight: 700, marginTop: '12px'}}>Срочность ремонта</h2>
                                <p style={{color: 'rgba(255,255,255,0.6)', marginTop: '8px'}}>Как быстро нужно отремонтировать?</p>
                            </div>
                            
                            <div style={{display: 'flex', flexDirection: 'column', gap: '12px'}}>
                                {urgencyOptions.map((option, i) => (
                                    <button key={option.id} onClick={() => handleUrgencySelect(option)}
                                        className={`urgency-btn ${option.color} ${formData.urgency === option.id ? 'selected' : ''}`}
                                        style={{display: 'flex', alignItems: 'center', gap: '16px', padding: '18px 20px', animationDelay: `${i * 0.1}s`}}>
                                        <span style={{fontSize: '28px'}}>{option.icon}</span>
                                        <div style={{textAlign: 'left'}}>
                                            <div style={{fontWeight: 600, fontSize: '16px'}}>{option.name}</div>
                                            <div style={{fontSize: '13px', color: 'rgba(255,255,255,0.5)', marginTop: '2px'}}>{option.desc}</div>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}
                    
                    {/* Шаг 5: Контакты */}
                    {step === 5 && (
                        <div className="animate-fade-in">
                            <div style={{textAlign: 'center', marginBottom: '24px'}}>
                                <span style={{fontSize: '40px'}}>📞</span>
                                <h2 style={{fontSize: '22px', fontWeight: 700, marginTop: '12px'}}>Контактные данные</h2>
                                <p style={{color: 'rgba(255,255,255,0.6)', marginTop: '8px'}}>Как с вами связаться?</p>
                            </div>
                            
                            <div style={{marginBottom: '16px'}}>
                                <label style={{display: 'block', marginBottom: '8px', fontSize: '14px', color: 'rgba(255,255,255,0.7)'}}>📍 Адрес (опционально)</label>
                                <input type="text" className="input-field" placeholder="Город, улица, дом"
                                    value={formData.address} onChange={(e) => setFormData({...formData, address: e.target.value})} />
                            </div>
                            
                            <div style={{marginBottom: '24px'}}>
                                <label style={{display: 'block', marginBottom: '8px', fontSize: '14px', color: 'rgba(255,255,255,0.7)'}}>📱 Номер телефона *</label>
                                <input type="tel" className="input-field" placeholder="+7 999 123-45-67"
                                    value={formData.phone} onChange={(e) => setFormData({...formData, phone: e.target.value})} />
                            </div>
                            
                            <button onClick={handleSubmit} disabled={formData.phone.length < 10}
                                className="btn-primary animate-pulse-glow" style={{width: '100%', fontSize: '18px', padding: '18px', opacity: formData.phone.length >= 10 ? 1 : 0.5}}>
                                ✨ Отправить заявку
                            </button>
                            
                            <p style={{textAlign: 'center', fontSize: '13px', color: 'rgba(255,255,255,0.4)', marginTop: '16px'}}>
                                Нажимая кнопку, вы соглашаетесь на обработку данных
                            </p>
                        </div>
                    )}
                </div>
            );
        }
        
        // Экран успеха
        function SuccessScreen({ formData, onClose }) {
            const orderNumber = String(Math.floor(Math.random() * 99999)).padStart(5, '0');
            
            useEffect(() => {
                // Отправляем данные в Telegram
                if (window.Telegram?.WebApp) {
                    window.Telegram.WebApp.sendData(JSON.stringify({
                        ...formData,
                        orderNumber: orderNumber,
                        timestamp: new Date().toISOString()
                    }));
                }
            }, []);
            
            return (
                <div style={{minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '24px', position: 'relative', zIndex: 1}}>
                    <Particles />
                    <Confetti />
                    
                    <div className="animate-bounce-in" style={{
                        width: '120px', height: '120px', borderRadius: '50%',
                        background: 'linear-gradient(135deg, #22c55e 0%, #16a34a 100%)',
                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                        fontSize: '60px', marginBottom: '24px',
                        boxShadow: '0 20px 60px rgba(34, 197, 94, 0.4)'
                    }}>✓</div>
                    
                    <h1 className="animate-fade-in" style={{fontSize: '28px', fontWeight: 700, marginBottom: '8px', textAlign: 'center', animationDelay: '0.3s'}}>
                        Заявка отправлена!
                    </h1>
                    
                    <p className="animate-fade-in" style={{fontSize: '16px', color: 'rgba(255,255,255,0.7)', marginBottom: '24px', textAlign: 'center', animationDelay: '0.4s'}}>
                        Номер заявки: <strong style={{color: '#8b5cf6'}}>#{orderNumber}</strong>
                    </p>
                    
                    <div className="glass-card animate-slide-up" style={{padding: '20px', width: '100%', maxWidth: '320px', animationDelay: '0.5s'}}>
                        <div style={{display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '16px'}}>
                            <div style={{width: '48px', height: '48px', borderRadius: '12px', background: 'rgba(139, 92, 246, 0.2)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '24px'}}>🔧</div>
                            <div>
                                <div style={{fontWeight: 600}}>MrFixik</div>
                                <div style={{fontSize: '13px', color: 'rgba(255,255,255,0.5)'}}>Свяжется в течение 15 минут</div>
                            </div>
                        </div>
                        <div style={{borderTop: '1px solid rgba(255,255,255,0.1)', paddingTop: '16px'}}>
                            <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '8px'}}>
                                <span style={{color: 'rgba(255,255,255,0.5)'}}>Устройство:</span>
                                <span>{formData.brand}</span>
                            </div>
                            <div style={{display: 'flex', justifyContent: 'space-between'}}>
                                <span style={{color: 'rgba(255,255,255,0.5)'}}>Срочность:</span>
                                <span>{formData.urgency === 'low' ? 'Не срочно' : formData.urgency === 'medium' ? '1-3 дня' : 'Срочно'}</span>
                            </div>
                        </div>
                    </div>
                    
                    <button onClick={onClose} className="btn-primary animate-fade-in" style={{marginTop: '32px', animationDelay: '0.7s'}}>
                        Закрыть
                    </button>
                </div>
            );
        }
        
        // Главный компонент
        function App() {
            const [screen, setScreen] = useState('welcome');
            const [formData, setFormData] = useState(null);
            
            useEffect(() => {
                if (window.Telegram?.WebApp) {
                    window.Telegram.WebApp.ready();
                    window.Telegram.WebApp.expand();
                }
            }, []);
            
            const handleSubmit = (data) => {
                setFormData(data);
                setScreen('success');
            };
            
            const handleClose = () => {
                if (window.Telegram?.WebApp) {
                    window.Telegram.WebApp.close();
                } else {
                    setScreen('welcome');
                }
            };
            
            return (
                <>
                    {screen === 'welcome' && <WelcomeScreen onStart={() => setScreen('form')} />}
                    {screen === 'form' && <RepairForm onSubmit={handleSubmit} onBack={() => setScreen('welcome')} />}
                    {screen === 'success' && <SuccessScreen formData={formData} onClose={handleClose} />}
                </>
            );
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
